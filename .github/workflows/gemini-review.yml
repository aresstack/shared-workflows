name: Gemini Flex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: gemini-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out trusted review implementation
        uses: actions/checkout@v4
        with:
          repository: '${{ job.workflow_repository }}'
          ref: '${{ job.workflow_sha }}'
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install review dependencies
        run: python -m pip install -r requirements.txt
      - name: Review pull request
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GITHUB_TOKEN: '${{ github.token }}'
          REPO: '${{ github.repository }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          GEMINI_THINKING_LEVEL: medium
        run: python -I scripts/review_pr.py
